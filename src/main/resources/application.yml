server:
  port: 8083

spring:
  application:
    name: tcc-registry-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:registrydb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
